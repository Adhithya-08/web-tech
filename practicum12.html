
<!DOCTYPE html>
<html>
<head>
    <title>DataVision - API Integration</title>

    <style>
        body {
            font-family: Arial;
            background: #eef3f8;
            color: #17365d;
        }

        header {
            background: #17365d;
            color: white;
            text-align: center;
            padding: 25px;
        }

        section {
            background: white;
            width: 90%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        button {
            background: #2563a6;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #2563a6;
            color: white;
        }

        tr:nth-child(even) {
            background: #eef3f8;
        }

        #status {
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>

<body>

<header>
    <h1>DataVision Analytics</h1>
    <p>Live Project Information Dashboard</p>
</header>

<section>
    <h2>Project Information</h2>

    <button id="loadBtn">Load Project Data</button>

    <p id="status">Click the button to retrieve project data.</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Project ID</th>
                    <th>Project Name</th>
                    <th>Description</th>
                </tr>
            </thead>

            <tbody id="projectTable">
            </tbody>
        </table>
    </div>
</section>

<script>
    const loadBtn = document.getElementById("loadBtn");
    const status = document.getElementById("status");
    const projectTable = document.getElementById("projectTable");

    async function loadProjects() {
        status.textContent = "Loading project data...";
        projectTable.innerHTML = "";

        loadBtn.disabled = true;

        try {
            const response = await fetch(
                "https://jsonplaceholder.typicode.com/posts?_limit=10"
            );

            if (!response.ok) {
                throw new Error("Unable to fetch project data.");
            }

            const data = await response.json();

            data.forEach(function(project) {
                const row = document.createElement("tr");

                const idCell = document.createElement("td");
                idCell.textContent = project.id;

                const nameCell = document.createElement("td");
                nameCell.textContent = project.title;

                const descCell = document.createElement("td");
                descCell.textContent = project.body;

                row.appendChild(idCell);
                row.appendChild(nameCell);
                row.appendChild(descCell);

                projectTable.appendChild(row);
            });

            status.textContent = "Project data loaded successfully!";

        } catch (error) {
            status.textContent = "Error: " + error.message;

        } finally {
            loadBtn.disabled = false;
        }
    }

    loadBtn.addEventListener("click", loadProjects);
</script>

</body>
</html>
